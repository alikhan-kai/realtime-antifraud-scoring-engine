server:
  port: 8080

spring:
  application:
    name: fraud-gateway
  datasource:
    url: jdbc:postgresql://localhost:5433/antifraud
    username: postgres
    password: postgrespassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

resilience4j.circuitbreaker:
  instances:
    redis:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10s

